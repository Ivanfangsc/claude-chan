[project]
name = "claude-chan"
version = "1.0.1"
license = "MIT"
description = "Claude-Chan：Claude Code 工作状态的桌面伙伴（Qt 版）"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.8",
    "pillow>=11",
]

[project.scripts]
claude-chan = "claude_chan.app:main"

[dependency-groups]
dev = [
    "av>=18.1.0",
    "numpy>=2.5.3",
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_chan"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
